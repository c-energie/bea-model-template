# The package's tests on every push and pull request. Self-contained: installs from PyPI only.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Add Windows or Python 3.11 here, e.g. os: [ubuntu-latest, windows-latest] and
        # python: ["3.11", "3.13"].
        os: [ubuntu-latest]
        python: ["3.13"]
    defaults:
      run:
        shell: bash
    env:
      # Under CI, a run that collects no test class fails rather than passing as NO TESTS RAN.
      CI: "true"
      TEST_TIER: fast
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m unittest discover -v
